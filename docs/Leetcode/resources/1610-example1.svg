<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="420" height="320" fill="#ffffff"/>

  <!-- field of view wedge (angle = 90, gazing between east and north) -->
  <polygon points="105,225 605,225 105,-275" fill="#bfe3fa" fill-opacity="0.9"/>

  <!-- axes -->
  <line x1="50" y1="280" x2="303" y2="280" stroke="black" stroke-width="1.5"/>
  <polygon points="303,280 296,276 296,284" fill="black"/>
  <line x1="50" y1="280" x2="50" y2="27" stroke="black" stroke-width="1.5"/>
  <polygon points="50,27 46,34 54,34" fill="black"/>

  <!-- ticks -->
  <g font-size="12" fill="#333">
    <line x1="50" y1="280" x2="50" y2="284" stroke="black"/>
    <text x="50" y="298" text-anchor="middle">0</text>
    <line x1="105" y1="280" x2="105" y2="284" stroke="black"/>
    <text x="105" y="298" text-anchor="middle">1</text>
    <line x1="160" y1="280" x2="160" y2="284" stroke="black"/>
    <text x="160" y="298" text-anchor="middle">2</text>
    <line x1="215" y1="280" x2="215" y2="284" stroke="black"/>
    <text x="215" y="298" text-anchor="middle">3</text>
    <line x1="270" y1="280" x2="270" y2="284" stroke="black"/>
    <text x="270" y="298" text-anchor="middle">4</text>

    <line x1="46" y1="225" x2="50" y2="225" stroke="black"/>
    <text x="38" y="229" text-anchor="middle">1</text>
    <line x1="46" y1="170" x2="50" y2="170" stroke="black"/>
    <text x="38" y="174" text-anchor="middle">2</text>
    <line x1="46" y1="115" x2="50" y2="115" stroke="black"/>
    <text x="38" y="119" text-anchor="middle">3</text>
    <line x1="46" y1="60" x2="50" y2="60" stroke="black"/>
    <text x="38" y="64" text-anchor="middle">4</text>
  </g>

  <!-- points: (2,1), (2,2), (3,3) -->
  <circle cx="160" cy="225" r="5" fill="#e05a5a"/>
  <circle cx="160" cy="170" r="5" fill="#e05a5a"/>
  <circle cx="215" cy="115" r="5" fill="#e05a5a"/>

  <!-- location (1,1) -->
  <circle cx="105" cy="225" r="7" fill="#f5a623" opacity="0.6"/>
  <circle cx="105" cy="225" r="4.5" fill="#111111"/>
</svg>
